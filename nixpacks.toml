[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "npm install",
    "python3 -m venv /app/.venv",
    "/app/.venv/bin/pip install -r requirements.txt"
]

[phases.build]
dependsOn = ["install"]
cmds = [
    "npm run build",
    "echo '检查构建产物:'",
    "ls -R dist"
]

[start]
cmd = "/app/.venv/bin/python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
